seed: 42
device: cuda:0
num_steps_per_env: 24
init_at_random_ep_len: true
max_iterations: 9000
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - critic
clip_actions: null
check_for_nan: true
save_interval: 100
experiment_name: g1_perpetual
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 256
  - 128
  activation: elu
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.5
critic:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 256
  - 128
  activation: elu
algorithm:
  class_name: PPO
  value_loss_coef: 1.0
  clip_param: 0.2
  entropy_coef: 0.01
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0003
  schedule: fixed
  desired_kl: 0.01
  gamma: 0.99
  lam: 0.95
  max_grad_norm: 1.0
policy: {}
multi_gpu: null
